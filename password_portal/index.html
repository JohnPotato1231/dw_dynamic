<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>REMO · Password control</title>
<style>
:root{color-scheme:light;--ink:#182838;--muted:#607182;--line:#dce4ea;--blue:#176854}
*{box-sizing:border-box}body{margin:0;background:#f3f6f8;color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
.shell{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.sidebar{background:#112c35;color:#ecf6f5;padding:40px 30px;display:flex;flex-direction:column}
.brand{font-size:27px;font-weight:800;letter-spacing:4px;line-height:1.1}.brand small{display:block;font-size:10px;font-weight:500;letter-spacing:2.7px;margin-top:13px;color:#97b9ba}
.nav{margin-top:64px;background:#ffffff10;border:1px solid #ffffff15;border-radius:9px;padding:13px 15px;font-size:14px}.nav span{color:#6ee2b9;margin-right:10px}.aside-note{margin-top:auto;padding-top:90px;color:#9cb7ba;font-size:12px}.aside-note strong{display:block;color:#e4f2ee;font-size:13px;margin-bottom:9px}
main{max-width:1200px;width:100%;padding:48px 54px 32px;margin:auto}.masthead{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:32px;font-size:12px;color:var(--muted)}.connection{color:var(--blue)}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:1.7px;color:var(--blue);margin:0 0 12px}h2{font-size:30px;line-height:1.25;letter-spacing:-1px;margin:0 0 18px;font-weight:650}h3{font-size:21px;letter-spacing:-.5px;margin:0 0 12px;line-height:1.3}.muted{color:var(--muted);font-size:14px;margin:0 0 24px}.fine{font-size:12px;color:var(--muted);margin-top:20px}
.card{border:1px solid var(--line);background:white;border-radius:14px;padding:30px;box-shadow:0 3px 12px #132a3803}.login{max-width:490px;margin:60px auto}.topline{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.topline h2{max-width:550px}.columns{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;align-items:start}.stats{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:10px 0 24px}.stat{border:1px solid var(--line);border-radius:10px;padding:18px 22px;background:#edf3f1}.stat strong{font-size:13px}.stat p{font-size:12px;color:var(--muted);margin:3px 0 0}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#269575;margin-right:8px}
label{display:block;font-size:12px;font-weight:650;margin:18px 0 7px}input{width:100%;border:1px solid #cbd6df;border-radius:7px;background:#fbfcfd;padding:12px 13px;font:inherit;color:var(--ink);min-height:46px}input:focus{outline:3px solid #17685420;border-color:#176854}button{display:flex;justify-content:space-between;align-items:center;gap:20px;border:1px solid transparent;border-radius:7px;background:var(--blue);color:white;font:600 13px system-ui;padding:14px 18px;cursor:pointer;margin-top:24px;min-height:45px;width:100%}button:hover{background:#105641}button:focus-visible{outline:3px solid #57b49c;outline-offset:3px}.secondary{background:white;color:var(--ink);border-color:#cbd6df}.secondary:hover{background:#edf3f1}.topline button{margin-top:0;white-space:nowrap}.activity{margin-top:22px}.table-scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:12px;text-align:left}th{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:600}td,th{padding:13px 8px 13px 0;border-bottom:1px solid #e9eef1}tr:last-child td{border-bottom:0}.notice{border:1px solid #b7d1c6;background:#e7f1eb;padding:14px 18px;border-radius:8px;margin-bottom:24px;font-size:13px}
@media(max-width:1000px){main{padding:36px 28px}.shell{grid-template-columns:200px 1fr}.sidebar{padding:34px 24px}.columns{grid-template-columns:1fr}.stats{gap:12px}}
@media(max-width:650px){.shell{display:block}.sidebar{padding:22px 24px}.brand{font-size:23px}.brand small{margin-top:8px}.nav,.aside-note{display:none}main{padding:26px 18px}.masthead{font-size:10px;margin-bottom:24px}h2{font-size:26px}.card{padding:24px}.login{margin:28px auto}.stats{grid-template-columns:1fr}.topline{gap:12px}.topline button{font-size:11px;padding:10px}.connection{white-space:nowrap}}
</style></head>
<body><div class="shell"><aside class="sidebar"><div class="brand">REMO<small>ACCESS MANAGEMENT</small></div>
<div class="nav"><span aria-hidden="true">&#9670;</span>Password control</div><div class="aside-note"><strong>One place. Current access.</strong>Manage the password your connected installers use, without sending a new EXE.</div></aside>
<main><header class="masthead"><span>REMO / ADMIN PORTAL</span><span class="connection">&#9679; Secure connection</span></header>{{MESSAGE}}{{CONTENT}}</main></div></body></html>
